[SystemSettings]
; ⚑ CVARS GO HERE, NOT IN [/Script/Engine.RendererSettings].
;   That section is read as URendererSettings PROPERTIES -- r.Shadow.Virtual.Enable
;   is one, but NormalBias and Cache are plain console variables and were simply
;   ignored there. Which is why lowering the bias appeared to change nothing:
;   it was never applied. VrgSimActor logs the values it actually reads back at
;   startup so this cannot silently rot again.
r.Shadow.Virtual.NormalBias=0.06
