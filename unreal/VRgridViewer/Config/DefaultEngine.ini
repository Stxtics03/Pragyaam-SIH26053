[/Script/EngineSettings.GameMapsSettings]
; An ENGINE map, so this project ships no .uasset of its own and still runs.
; AVrgGameMode spawns the viewer into it at StartPlay.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/VRgridViewer.VrgGameMode

[/Script/Engine.RendererSettings]
; Two very different renderers share this project. The MAP viewer is unlit
; instances and wants none of this. The SIM is a daylight street, where
; bounced light and reflections are most of what separates "architecture" from
; "boxes" -- recessed windows only read if something fills the recess with
; shadow, and glass only reads if it reflects the sky. So Lumen is ON, and the
; map view simply does not benefit from it rather than being harmed.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.Bias=-0.4
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=0
r.Lumen.ScreenProbeGather.RadianceCache=1
r.Shadow.Virtual.Enable=1
; ⚑ WHY THE CARS STOOD APART FROM THEIR SHADOWS.
;   Virtual shadow maps, not cascaded ones -- so every CSM knob
;   (DynamicShadowCascades, ShadowBias, CascadeDistributionExponent,
;   DynamicShadowDistanceMovableLight) is inert here, which is why tuning them
;   changed nothing at all.
;   VSM's own NormalBias offsets the RECEIVER's sample along its surface
;   normal to stop a flat surface shadowing itself. The offset is in TEXELS,
;   and on a street-sized clipmap a texel is large, so at the 0.5 default the
;   ground sample moved far enough that the contact point came away from the
;   wheels -- a car-length gap with the sun at 68 degrees. 0.06 keeps the
;   acne away without moving the contact point visibly.
; ⚑ AND THE SHADOW HAS TO BE REDRAWN WHEN THE CAR MOVES.
;   Virtual shadow maps CACHE their pages and redraw only what an object
;   invalidates. The ego car's pages were not being invalidated promptly, so
;   its shadow stayed where the car had been -- about 2 m back at 8.2 m/s,
;   which is a clear gap between a car and its own shadow, and the reason it
;   read as floating. Proof: stop the car (-VrgSpeed=0) and the gap closes,
;   which a projection error would not do.
;   Caching off costs some GPU on a scene this small and removes the lag
;   outright.
;   And give the near ground finer texels to begin with, so whatever bias
;   remains is measured in centimetres rather than metres.
r.AllowStaticLighting=False

[/Script/Engine.Engine]
; Fixed 10 Hz content on a 60 Hz display: the viewer advances frames on its own
; accumulator (see AVrgSceneActor::bFixedTimestep), so the render rate is free
; to be whatever the machine gives. Smoothing off so the accumulator sees the
; real delta rather than an averaged one.
bSmoothFrameRate=False

